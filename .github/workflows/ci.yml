name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # The minimum supported Rust version, from rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Includes the end-to-end tests, against mocks started in the test process.
      - run: cargo test --locked
      # cargo test regenerates web/src/types from the Rust structs; they must be committed.
      - name: Generated TypeScript types are up to date
        run: |
          git status --porcelain -- web/src/types
          test -z "$(git status --porcelain -- web/src/types)"

  # Type-checks the browser code against the generated types. Only this job needs Node.
  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Runs the end-to-end tests against the Docker mock stack: the panel and mock containers.
  mock-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Start the mock stack
        run: docker compose -f compose.mock.yaml up -d --build --wait --wait-timeout 600
      - name: End-to-end tests
        run: cargo test --locked -p teltonika-panel --test e2e
        env:
          PANEL_URL: http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose -f compose.mock.yaml logs
      - name: Stop the mock stack
        if: always()
        run: docker compose -f compose.mock.yaml down
