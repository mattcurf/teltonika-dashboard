[workspace]
resolver = "3"
members = ["crates/teltonika", "crates/teltonika-panel"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
teltonika = { path = "crates/teltonika" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "process", "fs"] }
